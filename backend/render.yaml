services:
  - type: web
    name: ai-tools-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Opționale (vezi claude.py): CLAUDE_MODEL (implicit claude-opus-5-5) și
      # CLAUDE_FALLBACKS ("default" sau "off") — comutatoare fără deploy.
      - key: CLAUDE_MODEL
        sync: false
      - key: CLAUDE_FALLBACKS
        sync: false
      - key: FRONTEND_URL
        sync: false
